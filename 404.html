<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Off the Route — Ethan F. Cooley</title>
<meta name="robots" content="noindex">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" href="favicon-32.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Mono:wght@300;400;500&family=DM+Sans:opsz,wght@9..40,200;9..40,300;9..40,400;9..40,500&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --ink: #06090c; --bg: #0a0e12; --surface: #0e1318;
    --line: #1b232b; --line-soft: #151c23;
    --ocean: #2E7DA3; --ocean-hi: #6FB4D6; --ocean-dim: #1d465c; --glow: rgba(46,125,163,0.35);
    --bone: #ecf1f4; --mist: #8da0ab; --fog: #56646e;
    --serif: 'DM Serif Display', Georgia, serif;
    --sans: 'DM Sans', system-ui, sans-serif;
    --mono: 'DM Mono', 'SF Mono', monospace;
    --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
  }
  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--bone);
    font-family: var(--sans);
    font-weight: 300;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
  }
  ::selection { background: var(--ocean); color: var(--ink); }

  .aurora { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
  .aurora::before, .aurora::after { content: ''; position: absolute; width: 60vmax; height: 60vmax; border-radius: 50%; filter: blur(90px); opacity: 0.12; }
  .aurora::before { background: radial-gradient(circle, var(--ocean) 0%, transparent 65%); top: -28vmax; right: -18vmax; animation: drift-a 26s ease-in-out infinite alternate; }
  .aurora::after { background: radial-gradient(circle, #163a4d 0%, transparent 65%); bottom: -32vmax; left: -20vmax; animation: drift-b 32s ease-in-out infinite alternate; }
  @keyframes drift-a { to { transform: translate(-9vmax, 7vmax) scale(1.12); } }
  @keyframes drift-b { to { transform: translate(8vmax, -6vmax) scale(1.08); } }
  @media (prefers-reduced-motion: reduce) { .aurora::before, .aurora::after { animation: none; } }

  main {
    position: relative; z-index: 2;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 2rem;
  }

  .code {
    font-family: var(--mono);
    font-size: 0.72rem;
    color: var(--ocean-hi);
    letter-spacing: 0.26em;
    text-transform: uppercase;
    margin-bottom: 1.6rem;
    display: flex;
    align-items: center;
    gap: 0.9rem;
  }
  .code::before, .code::after { content: ''; width: 2.6rem; height: 1px; background: var(--ocean); box-shadow: 0 0 8px var(--glow); }

  h1 {
    font-family: var(--serif);
    font-size: clamp(3rem, 10vw, 6.5rem);
    line-height: 1;
    letter-spacing: -0.02em;
    margin-bottom: 1.6rem;
  }
  h1 em {
    font-style: italic;
    background: linear-gradient(110deg, var(--ocean-hi), var(--ocean) 70%);
    -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
  }

  p {
    font-size: clamp(0.95rem, 1.6vw, 1.1rem);
    color: var(--mist);
    max-width: 30rem;
    line-height: 1.7;
    margin-bottom: 2.6rem;
  }

  .btn {
    position: relative;
    display: inline-flex;
    align-items: center;
    gap: 0.7rem;
    font-family: var(--mono);
    font-size: 0.72rem;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    text-decoration: none;
    padding: 1rem 1.9rem;
    border: 1px solid var(--ocean-dim);
    color: var(--bone);
    overflow: hidden;
    transition: color 0.35s var(--ease-out), border-color 0.35s;
    background: rgba(14,19,24,0.5);
  }
  .btn .fill {
    position: absolute; inset: 0;
    background: var(--ocean);
    transform: translateY(101%);
    transition: transform 0.45s cubic-bezier(0.65,0.05,0,1);
    z-index: -1;
  }
  .btn:hover { color: var(--ink); border-color: var(--ocean); }
  .btn:hover .fill { transform: translateY(0); }

  .marker {
    margin-top: 3.2rem;
    font-family: var(--mono);
    font-size: 0.6rem;
    color: var(--fog);
    letter-spacing: 0.14em;
    text-transform: uppercase;
  }
</style>
</head>
<body>

<div class="aurora" aria-hidden="true"></div>

<main>
  <p class="code">Checkpoint Missing</p>
  <h1>Off the<br><em>Route</em></h1>
  <p>This page doesn't exist — the link may be old, or the trail just doesn't go this way. Let's get you back on course.</p>
  <a href="/" class="btn"><span class="fill"></span>Back to the route</a>
  <p class="marker">404 · ethancooley.github.io</p>
</main>

</body>
</html>
